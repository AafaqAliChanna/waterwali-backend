# --- Database Configuration ---
# CHANGED for security: your real password was hardcoded here and pushed to a
# public GitHub repo. Now read from an environment variable instead (see README).
spring.datasource.url=jdbc:postgresql://localhost:5432/waterwali
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# CHANGED for Phase 2: PostGIS-aware dialect, needed for Order.pickupLocation (a geography Point)
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# --- JWT Configuration ---
# CHANGED for security: your real secret was hardcoded here and pushed to a
# public GitHub repo. Now read from an environment variable instead (see README).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Server Configuration ---
server.port=8080
